        body {

        .no-scrollbar::-webkit-scrollbar { display: none; }

</head>

                                    <p className="font-bold text-white">"<span className="text-cyber-pink font-black">Please</span> don't click the link immediately."</p>
                                </div>
                                <div className="bg-cyber-pink/10 border-l-4 border-cyber-pink p-4 rounded-r-xl">
                                    <p className="font-bold text-white">"<span className="text-cyber-pink font-black">Please</span> check the sender and website address carefully."</p>
                                </div>
                                <div className="bg-cyber-pink/10 border-l-4 border-cyber-pink p-4 rounded-r-xl">
                                    <p className="font-bold text-white">"<span className="text-cyber-pink font-black">Please</span> ask an adult for help."</p>
                                </div>
                            </div>
                        </div>

                        {/* Warnings */}
                        <div className="cyber-panel neon-border-red rounded-3xl p-8 transform transition hover:scale-105">
                            <div className="text-5xl mb-4 text-center">⚠️</div>
                            <h3 className="text-2xl font-black text-center mb-4 text-cyber-red">Warnings</h3>
                            <p className="text-gray-400 font-bold text-center mb-6">Telling someone to avoid danger using 'Never'.</p>
                            <div className="space-y-4">
                                <div className="bg-cyber-red/10 border-l-4 border-cyber-red p-4 rounded-r-xl">
                                    <p className="font-bold text-white">"<span className="text-cyber-red font-black">Never</span> click a suspicious link just because someone tells you to."</p>
                                </div>
                                <div className="bg-cyber-red/10 border-l-4 border-cyber-red p-4 rounded-r-xl">
                                    <p className="font-bold text-white">"<span className="text-cyber-red font-black">Never</span> enter your password on a suspicious website."</p>
                                </div>
                                <div className="bg-cyber-red/10 border-l-4 border-cyber-red p-4 rounded-r-xl">
                                    <p className="font-bold text-white">"<span className="text-cyber-red font-black">Never</span> share your personal information with strangers."</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const ClickOrSkipView = () => {
            const [currentCaseIndex, setCurrentCaseIndex] = useState(0);
            const [feedback, setFeedback] = useState(null); 
            const [isScanning, setIsScanning] = useState(false);

            const currentCase = gameCases[currentCaseIndex];

            // Randomize options for display (but keep logic intact)
            const [shuffledOptions, setShuffledOptions] = useState([]);
            
            useEffect(() => {
                const optionsWithIndex = currentCase.options.map((opt, i) => ({ text: opt, originalIndex: i }));
                const shuffled = [...optionsWithIndex].sort(() => Math.random() - 0.5);
                setShuffledOptions(shuffled);
            }, [currentCaseIndex]);

            const handleAnswer = (originalIndex) => {
                setIsScanning(true);
                setTimeout(() => {
                    setIsScanning(false);
                    const isCorrect = originalIndex === currentCase.correct;
                    setFeedback({
                        isCorrect,
                        text: isCorrect ? "THREAT AVOIDED!" : "SYSTEM BREACH DETECTED!"
                    });
                }, 800); // Fake scan delay
            };

            const nextCase = () => {
                setFeedback(null);
                if (currentCaseIndex < gameCases.length - 1) {
                    setCurrentCaseIndex(currentCaseIndex + 1);
                } else {
                    setCurrentCaseIndex(0); 
                }
            };

            return (
                <div className="max-w-4xl mx-auto px-4 py-8 animate-fade-in flex flex-col items-center pb-24">
                    <div className="text-center mb-8">
                        <p className="font-tech text-cyber-pink tracking-[0.2em] mb-2 text-xl">SIMULATION MODULE</p>
                        <h2 className="text-5xl font-black text-white mb-2">🚦 CLICK OR SKIP?</h2>
                        <p className="text-xl font-bold text-cyber-cyan">Read the message and decide what to do!</p>
                    </div>

                    <div className="cyber-panel neon-border-cyan w-full max-w-md rounded-3xl overflow-hidden relative shadow-[0_0_30px_rgba(0,243,255,0.2)]">
                        {/* Status Bar */}
                        <div className="bg-black/60 px-4 py-3 flex justify-between items-center border-b border-cyber-cyan/30">
                            <span className="text-sm font-tech text-cyber-cyan">CASE_FILE: {currentCaseIndex + 1}/{gameCases.length}</span>
                            <span className="text-cyber-green text-xs font-tech animate-pulse">● SECURE CONNECTION</span>
                        </div>

                        {/* Phone Content */}
                        <div className="p-6 bg-[#0a0a1a] min-h-[300px] flex flex-col relative overflow-hidden">
                            {isScanning && <div className="scanner-line animate-scanline"></div>}
                            
                            <div className="flex items-center space-x-3 mb-6">
                                <div className="w-12 h-12 bg-gray-800 rounded-full flex items-center justify-center text-2xl border border-cyber-cyan shadow-[0_0_10px_#00f3ff]">👤</div>
                                <div>
                                    <p className="font-bold text-lg text-white">{currentCase.sender}</p>
                                    <p className="text-xs text-cyber-cyan font-tech">TIME: JUST NOW</p>
                                </div>
                            </div>
                            
                            <div className="bg-cyber-panel border border-cyber-cyan/50 text-white p-4 rounded-2xl rounded-tl-none whitespace-pre-wrap font-bold text-lg shadow-md mb-4 self-start max-w-[95%] relative">
                                {currentCase.message}
                            </div>
                        </div>

                        {/* Controls */}
                        <div className="p-6 bg-black/60 border-t border-cyber-cyan/30">
                            {!feedback ? (
                                <div className="grid grid-cols-1 gap-3">
                                    {shuffledOptions.map((opt, idx) => (
                                        <button 
                                            key={idx}
                                            onClick={() => handleAnswer(opt.originalIndex)}
                                            disabled={isScanning}
                                            className="cyber-btn bg-cyber-panel border border-cyber-cyan/50 hover:bg-cyber-cyan hover:text-black text-white font-black py-4 px-4 rounded-xl transition-all"
                                        >
                                            {opt.text}
                                        </button>
                                    ))}
                                </div>
                            ) : (
                                <div className={`p-6 rounded-2xl animate-slide-up text-center border-2 ${feedback.isCorrect ? 'bg-cyber-green/20 border-cyber-green shadow-[0_0_15px_#39ff14]' : 'bg-cyber-red/20 border-cyber-red shadow-[0_0_15px_#ff1744]'}`}>
                                    <h3 className={`text-2xl font-black mb-2 ${feedback.isCorrect ? 'text-cyber-green' : 'text-cyber-red'}`}>
                                        {feedback.isCorrect ? '✅ ' : '❌ '}{feedback.text}
                                    </h3>
                                    <p className="font-bold text-white mb-6">{currentCase.explanation}</p>
                                    <button 
                                        onClick={nextCase}
                                        className={`cyber-btn font-black py-3 px-8 rounded-full text-black uppercase tracking-wider w-full ${feedback.isCorrect ? 'bg-cyber-green' : 'bg-cyber-red text-white'}`}
                                    >
                                        {currentCaseIndex < gameCases.length - 1 ? "SCAN NEXT MESSAGE ➡️" : "REBOOT SIMULATION 🔄"}
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const QuizView = ({ setView }) => {
            const [currentQ, setCurrentQ] = useState(0);
            const [score, setScore] = useState(0);
            const [showResult, setShowResult] = useState(false);
            const [selectedAnswer, setSelectedAnswer] = useState(null);
            const [isEvaluating, setIsEvaluating] = useState(false);

            const question = quizQuestions[currentQ];

            const handleSelect = (idx) => {
                if (isEvaluating) return;
                setSelectedAnswer(idx);
                setIsEvaluating(true);
                
                const correct = idx === question.correct;
                if (correct) setScore(prev => prev + 1);

                setTimeout(() => {
                    if (currentQ < quizQuestions.length - 1) {
                        setCurrentQ(prev => prev + 1);
                        setSelectedAnswer(null);
                        setIsEvaluating(false);
                    } else {
                        setShowResult(true);
                    }
                }, 3000); 
            };

            const resetQuiz = () => {
                setCurrentQ(0);
                setScore(0);
                setShowResult(false);
                setSelectedAnswer(null);
                setIsEvaluating(false);
            };

            if (showResult) {
                let title = "🔎 DETECTIVE IN TRAINING";
                let msg = "Keep practicing! Never click before you check!";
                let icon = "🔎";
                let colorClass = "cyber-cyan";
                
                if (score === 5) { title = "🏆 MASTER DETECTIVE"; msg = "Amazing! You are very careful online!"; icon = "🌟"; colorClass = "cyber-yellow"; }
                else if (score === 4) { title = "🥇 SMART DETECTIVE"; msg = "Great job! Keep checking before you click!"; icon = "👏"; colorClass = "cyber-green"; }
                else if (score === 3) { title = "🥈 JUNIOR DETECTIVE"; msg = "Good work! Remember: STOP, CHECK, DECIDE!"; icon = "👍"; }

                return (
                    <div className="max-w-2xl mx-auto px-4 py-12 animate-slide-up text-center pb-24">
                        <div className={`cyber-panel border-4 border-${colorClass} rounded-3xl p-8 shadow-[0_0_30px_currentColor] text-${colorClass}`}>
                            <div className="text-8xl mb-6 animate-float">{icon}</div>
                            <h2 className="text-2xl font-tech text-white mb-2 tracking-widest">AGENT CERTIFICATION SCORE</h2>
                            <div className={`text-7xl font-black mb-4 text-glow-${colorClass.split('-')[1]}`}>{score}/{quizQuestions.length}</div>
                            <h3 className={`text-4xl font-black mb-4`}>{title}</h3>
                            <p className="text-2xl font-bold text-white mb-8">{msg}</p>
                            
                            <div className="bg-black/50 p-6 rounded-2xl mb-8 border border-dashed border-gray-500">
                                <h4 className="font-black text-xl text-cyber-cyan mb-3 tracking-widest uppercase">🏆 Digital Safety Badge Earned</h4>
                                <p className="font-bold text-gray-300">This student knows how to:</p>
                                <div className="flex flex-col md:flex-row justify-center space-y-2 md:space-y-0 md:space-x-6 my-4 font-black text-lg text-white">
                                    <span className="bg-cyber-red/20 px-4 py-2 rounded-lg border border-cyber-red">🛑 STOP</span>
                                    <span className="bg-cyber-yellow/20 px-4 py-2 rounded-lg border border-cyber-yellow">🔍 CHECK</span>
                                    <span className="bg-cyber-cyan/20 px-4 py-2 rounded-lg border border-cyber-cyan">🧠 DECIDE</span>
                                </div>
                                <p className="font-tech text-cyber-green animate-pulse">STATUS: BE SMART BEFORE YOU CLICK!</p>
                            </div>

                            <button onClick={resetQuiz} className="cyber-btn bg-white text-black font-black py-4 px-8 rounded-full text-xl hover:bg-gray-200 transition-all uppercase tracking-widest">
                                PLAY AGAIN 🔄
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-3xl mx-auto px-4 py-8 animate-fade-in pb-24">
                    <div className="mb-8">
                        <div className="flex justify-between font-tech text-cyber-cyan mb-2 text-lg">
                            <span>DATA_NODE: {currentQ + 1} / {quizQuestions.length}</span>
                            <span>SCORE: {score}</span>
                        </div>
                        <div className="w-full bg-gray-800 rounded-full h-3 border border-cyber-cyan/30">
                            <div className="bg-cyber-cyan h-full rounded-full transition-all duration-500 shadow-[0_0_10px_#00f3ff]" style={{ width: `${((currentQ) / quizQuestions.length) * 100}%` }}></div>
                        </div>
                    </div>

                    <div className="cyber-panel neon-border-pink rounded-3xl p-8">
                        <h3 className="text-2xl md:text-3xl font-black text-white mb-8 leading-tight">{question.q}</h3>
                        
                        <div className="grid grid-cols-1 gap-4">
                            {question.opts.map((opt, idx) => {
                                let btnClass = "bg-cyber-panel border-cyber-cyan/30 text-gray-300 hover:border-cyber-cyan hover:text-white";
                                if (isEvaluating) {
                                    if (idx === question.correct) btnClass = "bg-cyber-green text-black border-cyber-green shadow-[0_0_15px_#39ff14] animate-pulse";
                                    else if (idx === selectedAnswer) btnClass = "bg-cyber-red text-white border-cyber-red shadow-[0_0_15px_#ff1744]";
                                    else btnClass = "bg-cyber-panel opacity-40 border-gray-700";
                                }

                                return (
                                    <button
                                        key={idx}
                                        onClick={() => handleSelect(idx)}
                                        disabled={isEvaluating}
                                        className={`text-left text-lg font-bold p-4 rounded-xl border-2 transition-all duration-300 ${btnClass} ${!isEvaluating && 'cyber-btn'}`}
                                    >
                                        <span className={`inline-block w-8 text-center rounded-md mr-3 py-1 font-tech ${isEvaluating && idx === question.correct ? 'bg-black/30' : 'bg-white/10'}`}>
                                            {String.fromCharCode(65 + idx)}
                                        </span>
                                        {opt}
                                    </button>
                                );
                            })}
                        </div>

                        {isEvaluating && (
                            <div className={`mt-6 p-5 rounded-xl font-bold text-lg animate-fade-in ${selectedAnswer === question.correct ? 'bg-cyber-green/20 text-cyber-green border border-cyber-green' : 'bg-cyber-red/20 text-cyber-red border border-cyber-red'}`}>
                                <div className="flex items-center mb-2">
                                    <span className="text-2xl mr-2">{selectedAnswer === question.correct ? '✅' : '❌'}</span>
                                    <span className="uppercase tracking-widest font-tech">{selectedAnswer === question.correct ? 'ACCESS GRANTED' : 'ACCESS DENIED'}</span>
                                </div>
                                <p className="text-white">{question.explanation}</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const PresentationView = () => {
            return (
                <div className="min-h-[80vh] flex flex-col items-center justify-center text-center p-4 md:p-8 animate-fade-in pb-24">
                    <div className="max-w-4xl w-full">
                        <div className="mb-10 inline-block border-b-2 border-cyber-cyan pb-2">
                            <p className="font-tech text-cyber-pink tracking-[0.3em] text-lg mb-2">LIVE COMMS FEED</p>
                            <h2 className="text-4xl md:text-5xl font-black text-white flex items-center justify-center text-glow-cyan">
                                <span className="mr-4">🎤</span> 1-Minute Briefing
                            </h2>
                        </div>
                        
                        <div className="cyber-panel neon-border-cyan rounded-3xl p-8 md:p-12 text-left shadow-[0_0_30px_rgba(0,243,255,0.1)] relative">
                            <div className="absolute top-4 right-6 text-cyber-cyan font-tech opacity-50 animate-pulse">REC ●</div>
                            
                            <div className="text-2xl md:text-3xl font-bold text-gray-200 leading-relaxed space-y-6">
                                <p>"Good morning, everyone!"</p>
                                
                                <div className="bg-cyber-yellow/10 border border-cyber-yellow p-6 rounded-2xl transform -rotate-1 shadow-lg">
                                    <p className="text-cyber-yellow font-black">
                                        "Imagine you receive a message saying, 'Congratulations! You won a free smartphone! Click here NOW!' Would you click it?"
                                    </p>
                                </div>
                                
                                <p className="text-cyber-red font-black text-5xl md:text-7xl text-center my-8 text-glow-red tracking-widest animate-pulse-glow">
                                    "STOP!"
                                </p>
                                
                                <p>"A suspicious link can be a trap."</p>
                                <p>"Today, we want to introduce our digital safety teaching aid called <span className="text-cyber-cyan font-black">Link Detective</span>."</p>
                                <p>"Our guide has three simple steps."</p>
                                
                                <div className="space-y-6 bg-black/40 p-6 rounded-2xl border-l-4 border-cyber-pink my-6">
                                    <p><span className="text-cyber-red font-black text-3xl">First, STOP!</span><br/>Please don't click the link immediately.</p>
                                    <p><span className="text-cyber-yellow font-black text-3xl">Next, CHECK!</span><br/>Check the sender and the website address carefully. Look for strange links, unknown senders, and messages that promise free prizes.</p>
                                    <p><span className="text-cyber-cyan font-black text-3xl">Finally, DECIDE!</span><br/>If the link looks suspicious, don't click it. Delete it, report it, or ask an adult for help.</p>
                                </div>

                                <p className="text-center mt-8">"Remember our safety code:</p>
                                <div className="flex justify-center my-4">
                                    <div className="bg-white text-black font-black text-3xl px-6 py-3 rounded-xl tracking-widest shadow-[0_0_20px_#ffffff]">
                                        STOP. CHECK. DECIDE.
                                    </div>
                                </div>
                                <p className="text-center">"Because smart students don't click first — they check first!"</p>
                                <p className="text-center font-black text-cyber-cyan">"Thank you!"</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const TeacherModeView = () => {
            return (
                <div className="max-w-5xl mx-auto px-4 py-8 animate-fade-in pb-24">
                    <div className="text-center mb-10">
                        <p className="font-tech text-cyber-red tracking-[0.3em] mb-2 text-xl">DIRECTOR'S CONSOLE</p>
                        <h2 className="text-5xl font-black text-white">👨‍🏫 Teacher's Guide</h2>
                    </div>
                    
                    <div className="grid md:grid-cols-2 gap-8">
                        <div className="cyber-panel neon-border-green rounded-3xl p-8">
                            <h3 className="text-2xl font-black mb-4 text-cyber-green flex items-center">
                                <span className="text-3xl mr-2">🎯</span> Learning Objective
                            </h3>
                            <div className="bg-cyber-green/10 border border-cyber-green p-6 rounded-xl">
                                <p className="text-xl text-white font-bold leading-relaxed">
                                    "Students can identify suspicious links and explain safe actions using simple English."
                                </p>
                            </div>
                        </div>

                        <div className="cyber-panel neon-border-cyan rounded-3xl p-8">
                            <h3 className="text-2xl font-black mb-4 text-cyber-cyan flex items-center">
                                <span className="text-3xl mr-2">🗣️</span> Required Language
                            </h3>
                            <ul className="space-y-4 text-lg font-bold text-gray-200">
                                <li className="flex items-center"><span className="bg-cyber-cyan/20 text-cyber-cyan font-tech px-3 py-1 rounded border border-cyber-cyan mr-4">1+</span> Polite imperative (Please...)</li>
                                <li className="flex items-center"><span className="bg-cyber-cyan/20 text-cyber-cyan font-tech px-3 py-1 rounded border border-cyber-cyan mr-4">1+</span> Warning (Never...)</li>
                                <li className="flex items-center"><span className="bg-cyber-cyan/20 text-cyber-cyan font-tech px-3 py-1 rounded border border-cyber-cyan mr-4">2+</span> Sequencing words (First, Next, Finally)</li>
                            </ul>
                        </div>

                        <div className="md:col-span-2 cyber-panel neon-border-pink rounded-3xl p-10 text-center relative overflow-hidden">
                            <div className="absolute top-0 right-0 w-32 h-32 bg-cyber-pink/20 blur-[50px] rounded-full"></div>
                            <h3 className="text-3xl font-black mb-4 text-white">⚡ Quick Classroom Activity</h3>
                            <p className="text-2xl font-bold mb-8 text-cyber-cyan">Read a message out loud to the class and ask them to show:</p>
                            <div className="flex justify-center space-x-6 md:space-x-12 text-3xl md:text-4xl font-black">
                                <div className="flex flex-col items-center bg-cyber-green/20 border border-cyber-green p-6 rounded-2xl w-40 md:w-56">
                                    <span className="text-6xl mb-4 drop-shadow-md">👍</span>
                                    <span className="text-cyber-green tracking-wider">SAFE</span>
                                </div>
                                <div className="flex flex-col items-center bg-cyber-red/20 border border-cyber-red p-6 rounded-2xl w-40 md:w-56">
                                    <span className="text-6xl mb-4 drop-shadow-md">✋</span>
                                    <span className="text-cyber-red tracking-wider">SUSPICIOUS</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [currentView, setCurrentView] = useState('home');

            useEffect(() => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, [currentView]);

            const renderView = () => {
                switch(currentView) {
                    case 'home': return <HomeView setView={setCurrentView} />;
                    case 'mission': return <MissionView />;
                    case 'english': return <EnglishToolsView />;
                    case 'game': return <ClickOrSkipView />;
                    case 'quiz': return <QuizView setView={setCurrentView} />;
                    case 'presentation': return <PresentationView />;
                    case 'teacher': return <TeacherModeView />;
                    default: return <HomeView setView={setCurrentView} />;
                }
            };

            return (
                <div className="min-h-screen flex flex-col font-sans relative">
                    {/* Background decor */}
                    <div className="fixed top-0 left-0 w-full h-full pointer-events-none z-[-1] overflow-hidden">
                        <div className="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-cyber-cyan/10 blur-[100px] rounded-full mix-blend-screen"></div>
                        <div className="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-cyber-pink/10 blur-[100px] rounded-full mix-blend-screen"></div>
                    </div>

                    <main className="flex-grow pt-8 overflow-x-hidden relative z-10">
                        {renderView()}
                    </main>
                    <Navigation currentView={currentView} setView={setCurrentView} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
