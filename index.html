                        'fade-in': 'fadeIn 0.6s ease-out forwards',
                        'slide-up': 'slideUp 0.5s ease-out forwards',
                        'pop-in': 'popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards'
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },

                        scanline: {
                            '0%': { transform: 'translateY(-100%)' },
                            '100%': { transform: 'translateY(400%)' }

                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <!-- React & ReactDOM -->

    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for JSX -->

    <!-- Tone.js for Procedural Background Music -->

    <style>
        body { 
            font-family: 'Nunito', sans-serif; 
            background-color: #05051a; 
            color: #ffffff; 
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            background-position: center center;
            overflow-x: hidden;
            /* Prevent pull-to-refresh on mobile */
            overscroll-behavior-y: none;
        }
        
        @media (min-width: 768px) {
            body { background-size: 40px 40px; }
        }
        
        .font-tech { font-family: 'Share Tech Mono', monospace; }

        /* Glassmorphism Cyber Panels */
        .cyber-panel {
            background: rgba(16, 16, 48, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 243, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        /* Neon Borders */
        .neon-border-cyan { border: 2px solid #00f3ff; box-shadow: 0 0 10px #00f3ff, inset 0 0 10px #00f3ff; }
        .neon-border-pink { border: 2px solid #ff007f; box-shadow: 0 0 10px #ff007f, inset 0 0 10px #ff007f; }
        .neon-border-red { border: 2px solid #ff1744; box-shadow: 0 0 15px #ff1744, inset 0 0 15px #ff1744; }
        .neon-border-green { border: 2px solid #39ff14; box-shadow: 0 0 15px #39ff14, inset 0 0 15px #39ff14; }
        .neon-border-yellow { border: 2px solid #fdfd96; box-shadow: 0 0 10px #fdfd96, inset 0 0 10px #fdfd96; }

        /* Glowing Text */
        .text-glow-cyan { text-shadow: 0 0 8px #00f3ff; }
        .text-glow-pink { text-shadow: 0 0 8px #ff007f; }
        .text-glow-red { text-shadow: 0 0 10px #ff1744; }
        
        /* Interactive Buttons */
        .cyber-btn {
            position: relative;
            overflow: hidden;
            transition: all 0.2s ease;
        }
        .cyber-btn:active { transform: scale(0.95); }
        .cyber-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;

        /* Hide Scrollbar for Navigation */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Data for "Click or Skip" Game
        const gameCases = [
            {
                id: 1, sender: "Unknown Number",
                message: "🎉 YOU WON!\nYou won a new bicycle! 🚲\nClick this link NOW to get your prize!",
                options: ["SAFE 🟢", "CHECK FIRST 🟡", "SUSPICIOUS — SKIP! 🔴"],
                correct: 2, // Index of correct option
                explanation: "Unexpected prize + urgent message ('NOW') + unknown link = Suspicious trap!"
            },
            {
                id: 2, sender: "👩‍🏫 Teacher's Message",
                message: "Hello students!\nHere is the link for today's online lesson.",
                options: ["SUSPICIOUS — SKIP! 🔴", "CHECK FIRST 🟡", "SAFE 🟢"],
                correct: 1,
                explanation: "Make sure the message really comes from your teacher and the link is expected."
            },
            {
                id: 3, sender: "System Alert",
                message: "🎮 FREE GAME MONEY!!!\nEnter your username and password NOW!",
                options: ["SAFE 🟢", "CHECK FIRST 🟡", "SUSPICIOUS — SKIP! 🔴"],
                correct: 2,
                explanation: "It asks for a password and uses an urgent message. Never share your password!"
            },
            {
                id: 4, sender: "👨‍👩‍👧 Mom",
                message: "Please open the family photo album using our usual family-sharing app.",
                options: ["LIKELY SAFE — BUT CHECK! 🟡", "SUSPICIOUS — SKIP! 🔴", "DON'T KNOW ⚪"],
                correct: 0,
                explanation: "Make sure the message really comes from Mom and the app is familiar."
            }
        ];

        // Data for Final Quiz
        const quizQuestions = [
            { q: "What should you do FIRST when you receive a suspicious link?", opts: ["Click it", "Share it with friends", "Stop and think", "Enter your password"], correct: 2, explanation: "Always STOP first before taking any action!" },
            { q: "Which message is suspicious?", opts: ["Your teacher sent today's lesson link.", "You won $10,000! Click NOW!", "Your parent sent a family photo.", "Your school sent an announcement."], correct: 1, explanation: "Messages offering massive unexpected prizes and demanding urgent action are highly suspicious." },
            { q: "What should you NEVER share with strangers online?", opts: ["Your favorite color", "Your password", "Your favorite food", "Your hobby"], correct: 1, explanation: "Your password is the key to your personal information. Never share it!" },
            { q: "Which word shows the sequence of the final step?", opts: ["First", "Next", "Finally", "Yesterday"], correct: 2, explanation: "'Finally' indicates the last step in our sequence: Decide." },
            { q: "Complete the sentence: 'Please ______ the link carefully.'", opts: ["check", "checking", "checked", "clicks"], correct: 0, explanation: "Use the base verb 'check' for polite imperatives." }
        ];

        const AudioManager = {
            initialized: false,
            padLoop: null,
            arpLoop: null,
            init: async function() {
                if (this.initialized) return;
                await Tone.start(); 
                Tone.Transport.bpm.value = 95;

                const vol = new Tone.Volume(-24).toDestination();
                
                const filter = new Tone.Filter(800, "lowpass").connect(vol);
                const lfo = new Tone.LFO(0.05, 400, 1200).connect(filter.frequency);
                lfo.start();

                const pad = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: "sawtooth" },
                    envelope: { attack: 2, decay: 2, sustain: 0.8, release: 4 }
                }).connect(filter);

                this.padLoop = new Tone.Sequence((time, chord) => {
                    pad.triggerAttackRelease(chord, "2m", time);
                }, [
                    ["C3", "Eb3", "G3"], 
                    ["Ab2", "C3", "Eb3"] 
                ], "2m");

                const pingPong = new Tone.PingPongDelay("8n.", 0.4).connect(vol);
                const arp = new Tone.Synth({
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.05, decay: 0.2, sustain: 0.1, release: 1 }
                }).connect(pingPong);
                arp.volume.value = -10;

                this.arpLoop = new Tone.Sequence((time, note) => {
                    if (note) arp.triggerAttackRelease(note, "16n", time);
                }, ["C5", null, null, "G4", null, "Eb4", null, "C4", "G4", null, null, null, "D4", null, "F4", null], "16n");

                this.initialized = true;
            },
            play: async function() {
                if (!this.initialized) await this.init();
                Tone.start();
                Tone.Destination.mute = false; // Memastikan suara nyala (Unmute)
                Tone.Transport.start();
                this.padLoop.start(0);
                this.arpLoop.start(0);
            },
            stop: function() {
                if (!this.initialized) return;
                // MATIKAN SEKETIKA (INSTANT CUT) tanpa mempedulikan sisa echo/sustain
                Tone.Destination.mute = true; 
                Tone.Transport.pause();
            }
        };

        const Navigation = ({ currentView, setView }) => {
            const navItems = [
                { id: 'home', icon: '🏠', label: 'HQ' },
                { id: 'mission', icon: '🛡️', label: 'Protocol' },
                { id: 'english', icon: '💬', label: 'Comms' },
                { id: 'game', icon: '🎯', label: 'Game' },
                { id: 'quiz', icon: '🧠', label: 'Exam' },
                { id: 'presentation', icon: '🎤', label: 'Brief' },
                { id: 'teacher', icon: '👨‍🏫', label: 'Teacher' }
            ];

            return (
                <nav className="fixed bottom-2 md:bottom-4 left-1/2 transform -translate-x-1/2 z-50 w-[98%] max-w-4xl">
                    <div className="cyber-panel neon-border-cyan rounded-full px-2 py-2 flex justify-start md:justify-center overflow-x-auto no-scrollbar items-center shadow-2xl">
                        {navItems.map(item => (
                            <button
                                key={item.id}
                                onClick={() => setView(item.id)}
                                className={`flex flex-col md:flex-row items-center justify-center space-x-0 md:space-x-2 px-3 py-2 md:px-4 md:py-3 rounded-full whitespace-nowrap transition-all mx-1 min-w-[60px] md:min-w-0 cyber-btn ${
                                    currentView === item.id 
                                    ? 'bg-cyber-cyan text-black font-black shadow-[0_0_15px_#00f3ff] scale-105' 
                                    : 'bg-transparent text-cyber-cyan hover:bg-cyber-cyan/20 hover:text-white font-bold'
                                }`}
                            >
                                <span className="text-xl mb-1 md:mb-0">{item.icon}</span>
                                <span className="text-[10px] md:text-sm uppercase tracking-wider">{item.label}</span>
                            </button>
                        ))}
                    </div>
                </nav>
            );
        };

        const HomeView = ({ setView }) => {
            const [hookState, setHookState] = useState('initial');

            return (
                <div className="flex flex-col items-center justify-center min-h-[85vh] px-4 animate-fade-in text-center pb-24">
                    {hookState === 'initial' && (
                        <div className="max-w-4xl w-full">
                            <div className="mb-6 md:mb-10 animate-float">
                                <h1 className="text-5xl sm:text-6xl md:text-8xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyber-cyan to-cyber-pink tracking-tighter text-glow-cyan leading-tight">
                                    LINK DETECTIVE
                                </h1>
                                <p className="text-xl sm:text-2xl md:text-3xl font-tech text-cyber-cyan mt-2 uppercase tracking-widest text-glow-cyan px-2">
                                    Be Smart Before You Click!
                                </p>
                            </div>
                            
                            <p className="text-lg md:text-xl text-gray-300 font-bold mb-8 px-4">
                                A link can look friendly... <br className="md:hidden"/> <span className="text-cyber-red">but it may be a trap!</span>
                            </p>
                            
                            {/* Simulated Smartphone */}
                            <div className="cyber-panel neon-border-cyan rounded-3xl p-1 relative w-[95%] max-w-sm mx-auto mb-8 animate-slide-up transform hover:scale-[1.02] transition-transform duration-300">
                                <div className="bg-cyber-red text-white font-black py-3 px-2 rounded-t-3xl flex items-center justify-center space-x-2 animate-pulse text-sm md:text-base">
                                    <span>🚨</span>
                                    <span className="tracking-widest">INCOMING MESSAGE!</span>
                                    <span>🚨</span>
                                </div>
                                
                                <div className="p-5 text-left bg-black/50 rounded-b-3xl">
                                    <div className="font-tech text-cyber-cyan text-xs md:text-sm mb-4 border-b border-cyber-cyan/30 pb-2 break-words">
                                        &gt; FROM: UNKNOWN_USER<br/>
                                        &gt; STATUS: ENCRYPTED
                                    </div>
                                    
                                    <h2 className="font-black text-2xl md:text-3xl text-cyber-yellow mb-2 text-glow-yellow">🎉 CONGRATS!</h2>
                                    <p className="text-lg md:text-xl text-white font-bold leading-snug">You have won a <br/><span className="text-cyber-pink">FREE SMARTPHONE!</span> 📱</p>
                                    <p className="text-sm md:text-base text-gray-400 mt-2 mb-4">Click here NOW to claim your prize!</p>
                                    
                                    <div className="bg-cyber-cyan/10 text-cyber-cyan p-2 md:p-3 rounded-lg text-center font-mono font-bold break-all border border-cyber-cyan/50 mb-6 text-xs md:text-sm">
                                        http://claim-free-phone-now.xyz
                                    </div>
                                    
                                    <h3 className="font-black text-lg md:text-xl mb-4 text-center text-white">❓ WHAT WILL YOU DO?</h3>
                                    
                                    <div className="flex flex-col gap-3 md:gap-4">
                                        <button 
                                            onClick={() => setHookState('warning')}
                                            className="cyber-btn bg-cyber-red/20 border-2 border-cyber-red hover:bg-cyber-red text-white font-black py-3 md:py-4 px-4 rounded-xl shadow-[0_0_15px_rgba(255,23,68,0.5)] transition-all text-sm md:text-base"
                                        >
                                            🔴 CLAIM PHONE NOW! (CLICK)
                                        </button>
                                        <button 
                                            onClick={() => setHookState('success')}
                                            className="cyber-btn bg-cyber-cyan text-black font-black py-3 md:py-4 px-4 rounded-xl shadow-[0_0_15px_rgba(0,243,255,0.8)] hover:bg-white transition-all flex items-center justify-center space-x-2 text-sm md:text-base"
                                        >
                                            <span className="text-xl">🕵️</span>
                                            <span>STOP & CHECK!</span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {hookState === 'warning' && (
                        <div className="cyber-panel neon-border-red p-6 md:p-8 rounded-3xl max-w-lg w-[95%] animate-pop-in">
                            <div className="text-6xl md:text-7xl mb-4 animate-float">🚨</div>
                            <h2 className="text-4xl md:text-5xl font-black text-cyber-red mb-4 text-glow-red tracking-wider">WAIT!</h2>
                            <p className="text-xl md:text-2xl font-bold mb-4 text-white">That could be a suspicious link!</p>
                            <p className="text-lg md:text-xl mb-8 text-gray-400">One click can put your information at risk.</p>
                            <button 
                                onClick={() => setHookState('initial')}
                                className="cyber-btn bg-cyber-red text-white font-black py-4 px-8 rounded-full text-lg md:text-xl shadow-[0_0_20px_#ff1744] hover:bg-white hover:text-cyber-red w-full uppercase"
                            >
                                Try Again 🔎
                            </button>
                        </div>
                    )}

                    {hookState === 'success' && (
                        <div className="cyber-panel neon-border-green p-6 md:p-8 rounded-3xl max-w-lg w-[95%] animate-pop-in relative overflow-hidden">
                            <div className="absolute top-0 left-0 w-full h-full bg-cyber-green/10 animate-pulse"></div>
                            <div className="relative z-10">
                                <div className="text-6xl md:text-7xl mb-4 animate-float">🎉</div>
                                <h2 className="text-4xl md:text-5xl font-black text-cyber-green mb-4 text-shadow-glow">GREAT JOB!</h2>
                                <p className="text-xl md:text-2xl font-bold mb-4 text-white">You didn't click immediately.</p>
                                <p className="text-lg md:text-xl mb-8 text-cyber-cyan">A smart student checks first!</p>
                                <button 
                                    onClick={() => setView('mission')}
                                    className="cyber-btn bg-cyber-green text-black font-black py-4 px-8 rounded-full text-lg md:text-xl shadow-[0_0_20px_#39ff14] hover:bg-white w-full uppercase animate-pulse-glow"
                                >
                                    Start Mission 🚀
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const MissionView = () => {
            return (
                <div className="max-w-6xl mx-auto px-4 py-8 md:py-12 animate-fade-in pb-28">
                    <div className="text-center mb-10 md:mb-16">
                        <p className="font-tech text-cyber-cyan text-sm md:text-xl tracking-[0.2em] md:tracking-[0.3em] mb-2">SYSTEM ARCHIVE // PROTOCOL S.C.D.</p>
                        <h2 className="text-3xl md:text-5xl lg:text-6xl font-black text-white mb-4">🕵️ THE DETECTIVE CODE</h2>
                        <h3 className="text-xl md:text-2xl font-bold text-cyber-pink text-glow-pink">Master the 3-Step Security Protocol</h3>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 md:gap-8 mb-16">
                        {/* Step 1 */}
                        <div className="cyber-panel neon-border-red rounded-3xl p-6 md:p-8 relative overflow-hidden group hover:-translate-y-2 transition-transform duration-300">
                            <div className="absolute -right-4 -top-4 text-8xl md:text-9xl font-black text-cyber-red/10 group-hover:text-cyber-red/20 transition-colors">S</div>
                            <h3 className="text-2xl md:text-3xl font-black text-cyber-red mb-4 flex items-center"><span className="text-3xl md:text-4xl mr-3">🛑</span> FIRST: STOP!</h3>
                            <div className="bg-cyber-red/10 border-l-4 border-cyber-red p-3 md:p-4 mb-6 rounded-r-lg">
                                <p className="font-bold text-base md:text-lg text-white italic">"Please don't click the link immediately."</p>
                            </div>
                            <ul className="space-y-3 mb-6 text-gray-300 font-bold text-sm md:text-base">

                                <li className="flex items-start"><span className="text-cyber-red mr-2">❓</span> Did I ask for this message?</li>
                                <li className="flex items-start"><span className="text-cyber-red mr-2">❓</span> Is the offer too good to be true?</li>
                                <li className="flex items-start"><span className="text-cyber-red mr-2">❓</span> Does the message make me feel rushed?</li>
                            </ul>
                            <div className="bg-cyber-red text-white p-3 rounded-xl font-bold text-xs md:text-sm shadow-[0_0_10px_#ff1744]">
                                ⚠️ Never click a suspicious link just because someone tells you to.
                            </div>
                        </div>

                        {/* Step 2 */}
                        <div className="cyber-panel neon-border-yellow rounded-3xl p-6 md:p-8 relative overflow-hidden group hover:-translate-y-2 transition-transform duration-300">
                            <div className="absolute -right-4 -top-4 text-8xl md:text-9xl font-black text-cyber-yellow/10 group-hover:text-cyber-yellow/20 transition-colors">C</div>
                            <h3 className="text-2xl md:text-3xl font-black text-cyber-yellow mb-4 flex items-center"><span className="text-3xl md:text-4xl mr-3">🔍</span> NEXT: CHECK!</h3>
                            <div className="bg-cyber-yellow/10 border-l-4 border-cyber-yellow p-3 md:p-4 mb-6 rounded-r-lg">
                                <p className="font-bold text-base md:text-lg text-white italic">"Please check the sender and website address carefully."</p>
                            </div>
                            <ul className="space-y-3 mb-6 text-gray-300 font-bold text-sm md:text-base">
                                <li className="flex items-start"><span className="text-cyber-yellow mr-2">🔎</span> Unknown sender</li>
                                <li className="flex items-start"><span className="text-cyber-yellow mr-2">🔎</span> Strange website address</li>
                                <li className="flex items-start"><span className="text-cyber-yellow mr-2">🔎</span> Misspelled words</li>
                                <li className="flex items-start"><span className="text-cyber-yellow mr-2">🔎</span> Fake prizes & Urgent messages</li>
                            </ul>
                            <div className="bg-cyber-yellow text-black p-3 rounded-xl font-bold text-xs md:text-sm shadow-[0_0_10px_#fdfd96]">
                                ⚠️ Never enter your personal information on a suspicious website.
                            </div>
                        </div>

                        {/* Step 3 */}
                        <div className="cyber-panel neon-border-cyan rounded-3xl p-6 md:p-8 relative overflow-hidden group hover:-translate-y-2 transition-transform duration-300">
                            <div className="absolute -right-4 -top-4 text-8xl md:text-9xl font-black text-cyber-cyan/10 group-hover:text-cyber-cyan/20 transition-colors">D</div>
                            <h3 className="text-2xl md:text-3xl font-black text-cyber-cyan mb-4 flex items-center"><span className="text-3xl md:text-4xl mr-3">🧠</span> FINALLY: DECIDE!</h3>
                            <div className="bg-cyber-cyan/10 border-l-4 border-cyber-cyan p-3 md:p-4 mb-6 rounded-r-lg">
                                <p className="font-bold text-base md:text-lg text-white italic">"If you are unsure, please ask an adult for help."</p>
                            </div>
                            <ul className="space-y-3 mb-6 text-gray-300 font-bold text-sm md:text-base">
                                <li className="flex items-start"><span className="text-cyber-cyan mr-2">❌</span> Don't click it.</li>
                                <li className="flex items-start"><span className="text-cyber-cyan mr-2">🗑️</span> Delete the message.</li>
                                <li className="flex items-start"><span className="text-cyber-cyan mr-2">🚩</span> Report it.</li>
                                <li className="flex items-start"><span className="text-cyber-cyan mr-2">👨‍👩‍👧</span> Ask a trusted adult.</li>
                            </ul>
                            <div className="bg-cyber-cyan text-black p-3 rounded-xl font-bold text-xs md:text-sm shadow-[0_0_10px_#00f3ff]">
                                ⚠️ Never share your password with strangers.

                            ${isMusicPlaying 
                                ? 'bg-cyber-cyan/20 border-cyber-cyan text-cyber-cyan shadow-[0_0_15px_rgba(0,243,255,0.4)]' 
                                : 'bg-black/50 border-gray-600 text-gray-400 hover:border-cyber-cyan hover:text-cyber-cyan'
                            }`}
                    >
                        <span className="text-lg md:text-base">{isMusicPlaying ? '🔊' : '🔇'}</span>
                        <span className="hidden md:inline text-sm">{isMusicPlaying ? 'BGM ON' : 'BGM OFF'}</span>
                    </button>

                    <main className="flex-grow pt-12 md:pt-8 relative z-10 w-full">
                        {renderView()}
                    </main>
                    
                    <Navigation currentView={currentView} setView={setCurrentView} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
